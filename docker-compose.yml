# Local development only: PostgreSQL (photos are saved to a local folder in development).
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: cone
      POSTGRES_PASSWORD: cone
      POSTGRES_DB: cone
    ports:
      - "5432:5432"
    volumes:
      - dbdata:/var/lib/postgresql/data
volumes:
  dbdata:
