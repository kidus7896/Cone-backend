# Local development only: PostgreSQL and an S3-compatible store (MinIO).
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: cone
      POSTGRES_PASSWORD: cone
      POSTGRES_DB: cone
    ports:
      - "5432:5432"
    volumes:
      - dbdata:/var/lib/postgresql/data
  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: cone
      MINIO_ROOT_PASSWORD: conesecret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data
volumes:
  dbdata:
  miniodata:
